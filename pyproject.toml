[project]
name = "expandingflow"
version = "0.1.0"
description = "Reference operators and microbenchmarks for Expanding Flow Maps (EFM), arXiv:2607.21585."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",      # Gauss-Hermite quadrature for the tau(t) time warp (App. C.2)
    "torch",
    "einops",
]

[project.optional-dependencies]
# Kernels. Kept optional so the analytic cost model and the reference path stay
# installable on a machine with no GPU -- `python -m bench.roofline` is CPU-only.
triton = ["triton>=3.0"]
# Benchmark reporting only; nothing in src/ imports these.
report = ["pandas", "pyarrow", "matplotlib"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis",   # property tests for the insertion scan and schedule invariants
    "treescope",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "gpu: requires CUDA",
    "slow: exhaustive property tests",
]
